name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 13 * * *'   # 8:00 AM ET (EST = UTC-5) every day

permissions:
  contents: write

jobs:
  lint:
    name: Lint and Type Check
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Type Check
      run: npm run typecheck

  test:
    name: Run Tests (shard ${{ matrix.shard }}/2)
    needs: lint
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Cache Playwright Browsers
      uses: actions/cache@v5
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps

    - name: Install Playwright System Dependencies (cache hit)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps

    - name: Run Test Shard
      run: npx playwright test --shard=${{ matrix.shard }}/2

    - name: Upload Allure Results
      uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: allure-results-shard-${{ matrix.shard }}
        path: allure-results/
        retention-days: 7

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-shard-${{ matrix.shard }}
        path: playwright-report/
        retention-days: 30

  publish-report:
    name: Publish Allure Report
    needs: test
    if: ${{ !cancelled() }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Download Allure Results from All Shards
      uses: actions/download-artifact@v8
      with:
        pattern: allure-results-shard-*
        path: allure-results/
        merge-multiple: true

    - name: Generate Allure Report
      run: npm run allure:generate

    - name: Publish Allure Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
        publish_branch: gh-pages

    - name: Report Published
      run: echo "Allure report live at https://newazlabs.github.io/PlaywrightProductionFramework/"

    - name: Upload Allure Report
      uses: actions/upload-artifact@v7
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

  notify:
    name: Notify on Failure
    needs: [lint, test]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
    # Activates once the SLACK_WEBHOOK_URL repository secret is set
    # (Slack -> Apps -> Incoming Webhooks -> copy URL into GitHub
    # Settings -> Secrets and variables -> Actions).
    - name: Send Slack Notification
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      if: env.SLACK_WEBHOOK_URL != ''
      run: |
        curl -s -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\":x: Playwright tests failed on *${{ github.repository }}* (${{ github.workflow }} / ${{ github.ref_name }}).\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\nReport: https://newazlabs.github.io/PlaywrightProductionFramework/\"}" \
          "$SLACK_WEBHOOK_URL"
