name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 13 * * *'   # 8:00 AM ET (EST = UTC-5) every day

permissions:
  contents: write

jobs:
  run-tests-and-publish-report:
    name: Run Tests and Publish Allure Report
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Step 1 - Checkout Repository
      uses: actions/checkout@v4

    - name: Step 2 - Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Step 3 - Install Dependencies
      run: npm ci

    - name: Step 4 - Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Step 5 - Run All Test Suites
      run: npx playwright test

    - name: Step 6 - Generate Allure Report
      if: ${{ !cancelled() }}
      run: npm run allure:generate

    - name: Step 7 - Publish Allure Report to GitHub Pages
      if: ${{ !cancelled() }}
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
        publish_branch: gh-pages

    - name: Step 8 - Upload Playwright HTML Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Step 9 - Upload Allure Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30
