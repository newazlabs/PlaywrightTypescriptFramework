name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 13 * * *'   # 8:00 AM ET (EST = UTC-5) every day

permissions:
  contents: write

jobs:
  run-tests-and-publish-report:
    name: Run Tests and Publish Allure Report
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Step 1 - Checkout Repository
      uses: actions/checkout@v4

    - name: Step 2 - Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Step 3 - Install Dependencies
      run: npm ci

    - name: Step 4 - Cache Playwright Browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Step 5 - Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps

    - name: Step 5 - Install Playwright System Dependencies (cache hit)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps

    - name: Step 6 - Run All Test Suites
      run: npx playwright test

    - name: Step 7 - Generate Allure Report
      if: ${{ !cancelled() }}
      run: npm run allure:generate

    - name: Step 8 - Publish Allure Report to GitHub Pages
      if: ${{ !cancelled() }}
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
        publish_branch: gh-pages

    - name: Step 9 - Report Published
      if: ${{ !cancelled() }}
      run: echo "Allure report live at https://newazlabs.github.io/PlaywrightProductionFramework/"

    - name: Step 10 - Upload Playwright HTML Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Step 11 - Upload Allure Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30
